<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit Requests - OXI ADMIN</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <!-- SweetAlert2 & FontAwesome & Fonts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0b061a;
            --card-bg: #160d2e;
            --cyan: #00ffd1;
            --purple: #b026ff;
            --text-light: #e0e0e0;
            --danger: #ff4d4d;
            --success: #00c853;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            padding: 30px 5%;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .back-btn {
            background: rgba(0, 255, 209, 0.1);
            color: var(--cyan);
            border: 1px solid var(--cyan);
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: var(--cyan);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 209, 0.4);
        }

        .content-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(176, 38, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 15px;
        }

        .card-header h2 {
            color: var(--cyan);
            font-size: 22px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(0, 0, 0, 0.3);
            color: #888;
            padding: 16px 20px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid rgba(0, 255, 209, 0.2);
        }

        td {
            padding: 18px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 14px;
        }

        .trx-badge {
            background: rgba(0, 255, 209, 0.1);
            color: var(--cyan);
            padding: 4px 10px;
            border-radius: 6px;
            font-family: monospace;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .gateway-tag {
            text-transform: uppercase;
            font-weight: 600;
            font-size: 12px;
        }

        .gw-bkash { color: #e2136e; }
        .gw-nagad { color: #f7941d; }
        .gw-rocket { color: #8c3494; }

        .btn-approve {
            background: rgba(0, 200, 83, 0.15);
            color: var(--success);
            border: 1px solid rgba(0, 200, 83, 0.3);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-right: 8px;
            transition: 0.3s;
        }

        .btn-approve:hover {
            background: var(--success);
            color: white;
        }

        .btn-reject {
            background: rgba(255, 77, 77, 0.15);
            color: var(--danger);
            border: 1px solid rgba(255, 77, 77, 0.3);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-reject:hover {
            background: var(--danger);
            color: white;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i> Dashboard</a>
    </div>

    <div class="content-card">
        <div class="card-header">
            <h2><i class="fas fa-hand-holding-usd"></i> Manual Deposit Requests</h2>
            <span style="font-size:12px; color:#888;" id="pending-count">0 Requests Pending</span>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>User Email</th>
                        <th>Gateway</th>
                        <th>Transaction ID</th>
                        <th>Amount</th>
                        <th style="text-align: right;">Action</th>
                    </tr>
                </thead>
                <tbody id="deposit-table-body">
                    <!-- Dynamic Loading -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        checkAuth();

        db.ref('deposit_requests').on('value', snapshot => {
            const tbody = document.getElementById('deposit-table-body');
            tbody.innerHTML = "";

            if (!snapshot.exists()) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#888; padding:40px;">No deposit requests pending.</td></tr>`;
                document.getElementById('pending-count').innerText = "0 Requests Pending";
                return;
            }

            let pendingCount = 0;

            snapshot.forEach(child => {
                const req = child.val();

                if (req.status === 'pending') {
                    pendingCount++;
                    const gwClass = (req.gateway || '').toLowerCase();

                    tbody.innerHTML += `
                        <tr>
                            <td><b>${req.userEmail || 'N/A'}</b></td>
                            <td><span class="gateway-tag gw-${gwClass}"><i class="fas fa-wallet"></i> ${req.gateway}</span></td>
                            <td><span class="trx-badge">${req.trxId}</span></td>
                            <td style="color:var(--cyan); font-weight:700;">৳${req.amount}</td>
                            <td style="text-align: right;">
                                <button class="btn-approve" onclick="approveDeposit('${child.key}', '${req.userKey}', ${req.amount})"><i class="fas fa-check"></i> Approve</button>
                                <button class="btn-reject" onclick="rejectDeposit('${child.key}')"><i class="fas fa-times"></i> Reject</button>
                            </td>
                        </tr>
                    `;
                }
            });

            document.getElementById('pending-count').innerText = `${pendingCount} Requests Pending`;

            if (pendingCount === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#888; padding:40px;">No pending deposit requests.</td></tr>`;
            }
        });

        function approveDeposit(reqKey, userKey, amount) {
            SwalDark.fire({
                title: 'Approve Deposit?',
                text: `৳${amount} will be added to user's wallet automatically.`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Yes, Approve',
                confirmButtonColor: '#00c853'
            }).then(result => {
                if (result.isConfirmed) {
                    // Transaction to safely update wallet balance
                    db.ref(`users/${userKey}/wallet`).transaction(current => (current || 0) + Number(amount)).then(() => {
                        db.ref(`deposit_requests/${reqKey}`).update({ status: 'approved', approvedAt: Date.now() });
                        SwalDark.fire('Approved!', 'User wallet balance updated.', 'success');
                    });
                }
            });
        }

        function rejectDeposit(reqKey) {
            SwalDark.fire({
                title: 'Reject Request?',
                text: 'This transaction request will be marked as rejected.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Yes, Reject',
                confirmButtonColor: '#ff4d4d'
            }).then(result => {
                if (result.isConfirmed) {
                    db.ref(`deposit_requests/${reqKey}`).update({ status: 'rejected', rejectedAt: Date.now() });
                    SwalDark.fire('Rejected', 'Deposit request has been rejected.', 'info');
                }
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OXI ADMIN - Access Control</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <!-- SweetAlert2 for Premium Popups -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b021a;
            --card-bg: #150a2e;
            --primary: #9d00ff;
            --accent: #00ffcc;
            --text: #ffffff;
            --text-dim: #b0a3c4;
            --danger: #ff1744;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            background-color: var(--bg-color);
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; color: var(--text); padding: 20px;
            overflow: hidden;
        }

        .login-card {
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 20px;
            width: 100%; max-width: 380px;
            border: 2px solid var(--primary);
            box-shadow: 0 0 25px rgba(157, 0, 255, 0.35);
            text-align: center;
            position: relative;
        }

        .login-icon {
            font-size: 45px;
            color: #ffb703;
            margin-bottom: 15px;
        }

        .login-card h2 {
            color: var(--accent);
            font-size: 22px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .login-card p {
            color: var(--text-dim);
            font-size: 13px;
            margin-bottom: 30px;
        }

        .google-btn {
            background: #ffffff;
            color: #000;
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }

        .google-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.2);
        }

        .status-msg {
            margin-top: 20px;
            font-size: 12px;
            color: var(--accent);
            display: none;
        }

        /* Custom SweetAlert Popup Style */
        .my-custom-swal {
            background: #150a2e !important;
            border: 1px solid #3d2b63 !important;
            border-radius: 20px !important;
            color: #ffffff !important;
        }

        .swal2-title {
            color: #ff1744 !important;
            font-size: 20px !important;
        }

        .swal2-html-container {
            color: #b0a3c4 !important;
            font-size: 14px !important;
            line-height: 1.6 !important;
        }

        .swal2-confirm {
            background-color: var(--primary) !important;
            border-radius: 10px !important;
            font-weight: bold !important;
            padding: 10px 25px !important;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-icon"><i class="fas fa-user-shield"></i></div>
        <h2>OXI ADMIN PANEL</h2>
        <p>Sign in with your authorized admin Google account</p>

        <button class="google-btn" onclick="signInWithGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" alt="Google">
            Sign in with Google
        </button>

        <div id="status-msg" class="status-msg"><i class="fas fa-spinner fa-spin"></i> Checking Admin Privileges...</div>
    </div>

    <script>
        // Custom SweetAlert Mixin
        const Popup = Swal.mixin({
            customClass: { popup: 'my-custom-swal' }
        });

        // --- Firebase Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyAkZkqcyP3P6QnbHT-wfxeygxgY9IoKBAU",
            authDomain: "oxi-esports.firebaseapp.com",
            projectId: "oxi-esports",
            storageBucket: "oxi-esports.firebasestorage.app",
            messagingSenderId: "924353594492",
            appId: "1:924353594492:web:08329a3d1f67e7a5da35f9",
            databaseURL: "https://oxi-esports-default-rtdb.firebaseio.com"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        function emailToKey(email) {
            return email ? email.replace(/\./g, ',') : '';
        }

        // --- Check Authorization Flow ---
        auth.onAuthStateChanged(user => {
            if (user) {
                showStatus(true);
                const emailKey = emailToKey(user.email);
                verifyAdminAccess(user.email, emailKey);
            } else {
                showStatus(false);
            }
        });

        function verifyAdminAccess(userEmail, emailKey) {
            // Check Super Admins first
            db.ref(`superAdmins/${emailKey}`).once('value', snapshot => {
                if (snapshot.exists()) {
                    window.location.href = 'dashboard.html';
                } else {
                    // Check Normal Admins
                    db.ref(`admins/${emailKey}`).once('value', adminSnap => {
                        if (adminSnap.exists()) {
                            window.location.href = 'dashboard.html';
                        } else {
                            // Unauthorized User -> Logout & Show Beautiful Popup
                            showStatus(false);
                            auth.signOut().then(() => {
                                Popup.fire({
                                    icon: 'error',
                                    title: 'অ্যাক্সেস অনুমোদিত নয়!',
                                    html: `আপনার এই Google অ্যাকাউন্টটি (<b>${userEmail}</b>) এডমিন প্যানেলে যুক্ত করা হয়নি।<br><br><span style="font-size:12px; color:#00ffcc;">অ্যাডমিন অ্যাক্সেস পাওয়ার জন্য মূল সুপার এডমিনের সাথে যোগাযোগ করুন।</span>`,
                                    confirmButtonText: 'ঠিক আছে'
                                });
                            });
                        }
                    });
                }
            });
        }

        function signInWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            showStatus(true);

            auth.signInWithPopup(provider).catch(error => {
                showStatus(false);
                Popup.fire({
                    icon: 'error',
                    title: 'লগইন ব্যর্থ হয়েছে!',
                    text: error.message,
                    confirmButtonText: 'ঠিক আছে'
                });
            });
        }

        function showStatus(show) {
            document.getElementById('status-msg').style.display = show ? 'block' : 'none';
        }
    </script>
</body>
</html>

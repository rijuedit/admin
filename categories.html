<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Categories - OXI ADMIN</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <!-- SweetAlert2 & FontAwesome & Fonts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0b061a;
            --card-bg: #160d2e;
            --cyan: #00ffd1;
            --purple: #b026ff;
            --text-light: #e0e0e0;
            --danger: #ff4d4d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            padding: 30px 5%;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .back-btn {
            background: rgba(0, 255, 209, 0.1);
            color: var(--cyan);
            border: 1px solid var(--cyan);
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: var(--cyan);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 209, 0.4);
        }

        .add-cat-btn {
            background: linear-gradient(90deg, var(--purple), #8a2be2);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 15px rgba(176, 38, 255, 0.3);
            transition: 0.3s;
        }

        .add-cat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(176, 38, 255, 0.6);
        }

        .header-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            border-left: 5px solid var(--cyan);
        }

        .header-box h2 {
            color: var(--cyan);
            font-size: 22px;
        }

        /* Category Grid (1:1 Ratio Top-Up Style) */
        .cat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
        }

        .cat-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            transition: 0.3s;
            cursor: pointer;
            text-align: center;
        }

        .cat-card:hover {
            transform: translateY(-5px);
            border-color: var(--cyan);
            box-shadow: 0 10px 25px rgba(0, 255, 209, 0.2);
        }

        .cat-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
        }

        .cat-card-title {
            padding: 15px 10px;
            font-weight: 600;
            font-size: 15px;
            color: #fff;
            background: rgba(0, 0, 0, 0.4);
        }

        .delete-icon {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 77, 77, 0.85);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .delete-icon:hover {
            background: var(--danger);
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i> Dashboard</a>
        <button class="add-cat-btn" onclick="showAddCategoryModal()"><i class="fas fa-plus"></i> Add New Category</button>
    </div>

    <div class="header-box">
        <h2><i class="fas fa-gamepad"></i> Game Categories</h2>
        <p style="font-size: 13px; color: #888;">Select a category to view and manage matches inside it.</p>
    </div>

    <div id="category-grid" class="cat-grid"></div>

    <script src="config.js"></script>
    <script>
        checkAuth();

        db.ref('match_categories').on('value', snapshot => {
            const grid = document.getElementById('category-grid');
            grid.innerHTML = "";

            if (!snapshot.exists()) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:50px; color:#888;">No categories found. Click "+ Add New Category" to create one.</div>`;
                return;
            }

            snapshot.forEach(child => {
                const cat = child.val();
                grid.innerHTML += `
                    <div class="cat-card">
                        <div class="delete-icon" onclick="deleteCategory(event, '${child.key}')"><i class="fas fa-trash-alt"></i></div>
                        <div onclick="window.location.href='matches.html?cat=${child.key}'">
                            <img src="${cat.image}" onerror="this.src='https://via.placeholder.com/300?text=No+Image'">
                            <div class="cat-card-title">${cat.title}</div>
                        </div>
                    </div>
                `;
            });
        });

        function showAddCategoryModal() {
            SwalDark.fire({
                title: 'Add New Category',
                html: `
                    <div style="text-align:left;">
                        <label style="font-size:12px; color:#aaa;">Category Title</label>
                        <input id="cat-title-input" class="swal2-input" placeholder="e.g. Free Fire" style="margin-top:5px; margin-bottom:15px;">
                        <label style="font-size:12px; color:#aaa;">Banner / Icon Image URL (1:1 Square Ratio)</label>
                        <input id="cat-img-input" class="swal2-input" placeholder="https://example.com/image.png" style="margin-top:5px;">
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'Create Category',
                confirmButtonColor: '#b026ff'
            }).then(result => {
                if (result.isConfirmed) {
                    const title = document.getElementById('cat-title-input').value.trim();
                    const image = document.getElementById('cat-img-input').value.trim();

                    if (title && image) {
                        db.ref('match_categories').push({ title, image }).then(() => {
                            SwalDark.fire('Created!', 'Category added successfully.', 'success');
                        });
                    } else {
                        SwalDark.fire('Error', 'Both Title and Image URL are required.', 'error');
                    }
                }
            });
        }

        function deleteCategory(event, key) {
            event.stopPropagation();
            SwalDark.fire({
                title: 'Delete Category?',
                text: 'All associated matches inside this category will still exist but won\'t be listed here.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Yes, Delete',
                confirmButtonColor: '#ff4d4d'
            }).then(result => {
                if (result.isConfirmed) {
                    db.ref(`match_categories/${key}`).remove().then(() => {
                        SwalDark.fire('Deleted!', 'Category has been removed.', 'success');
                    });
                }
            });
        }
    </script>
</body>
</html>

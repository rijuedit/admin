<!-- Admin/categories.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Categories - OXI E-Sports</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Config -->
    <script src="config.js"></script>
    <style>
        :root {
            --bg-color: #0b061a;
            --card-bg: #160d2e;
            --cyan-accent: #00ffd1;
            --purple-glow: #b026ff;
            --text-color: #ffffff;
            --text-muted: #a098c0;
            --danger-color: #ff4757;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            min-height: 100vh;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .btn-dashboard {
            background: transparent;
            border: 1px solid var(--cyan-accent);
            color: var(--cyan-accent);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-dashboard:hover {
            background: var(--cyan-accent);
            color: var(--bg-color);
            box-shadow: 0 0 15px rgba(0, 255, 209, 0.4);
        }

        .btn-add {
            background: linear-gradient(135deg, #8a2be2, #b026ff);
            border: none;
            color: white;
            padding: 10px 22px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 15px rgba(176, 38, 255, 0.4);
            transition: all 0.3s ease;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(176, 38, 255, 0.7);
        }

        .glass-card {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            padding: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .card-header h2 {
            margin: 0;
            font-size: 1.4rem;
            color: var(--cyan-accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .cat-card {
            background: rgba(11, 6, 26, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            position: relative;
            transition: all 0.3s ease;
        }

        .cat-card:hover {
            border-color: var(--cyan-accent);
            transform: translateY(-4px);
        }

        .cat-img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
            background: #160d2e;
        }

        .cat-title {
            font-size: 1.05rem;
            font-weight: bold;
            color: white;
            margin-bottom: 12px;
        }

        .cat-actions {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 8px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .btn-view { background: rgba(0, 255, 209, 0.15); color: var(--cyan-accent); border: 1px solid var(--cyan-accent); }
        .btn-del { background: rgba(255, 71, 87, 0.15); color: var(--danger-color); border: 1px solid var(--danger-color); }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="dashboard.html" class="btn-dashboard">
            <i class="fas fa-arrow-left"></i> Dashboard
        </a>
        <button class="btn-add" onclick="openAddCategoryModal()">
            <i class="fas fa-plus"></i> Add Category
        </button>
    </div>

    <div class="glass-card">
        <div class="card-header">
            <h2><i class="fas fa-list-alt"></i> Match Categories</h2>
        </div>

        <div class="category-grid" id="categoryContainer">
            <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">
                <i class="fas fa-spinner fa-spin fa-2x"></i><br><br>Loading Categories...
            </div>
        </div>
    </div>

    <script>
        auth.onAuthStateChanged(user => {
            if (user) {
                loadCategories();
            } else {
                window.location.href = 'login.html';
            }
        });

        function loadCategories() {
            db.ref('match_categories').on('value', snap => {
                const container = document.getElementById('categoryContainer');
                container.innerHTML = '';

                if (snap.exists()) {
                    snap.forEach(child => {
                        const cat = child.val();
                        const key = child.key;

                        container.innerHTML += `
                            <div class="cat-card">
                                <img src="${cat.image || 'https://cdn-icons-png.flaticon.com/512/3408/3408506.png'}" class="cat-img" alt="${cat.title}">
                                <div class="cat-title">${cat.title}</div>
                                <div class="cat-actions">
                                    <button class="btn-action btn-view" onclick="location.href='matches.html?cat=${key}'">
                                        <i class="fas fa-gamepad"></i> Matches
                                    </button>
                                    <button class="btn-action btn-del" onclick="deleteCategory('${key}')">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = `
                        <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">
                            No categories found. Click "Add Category" to create one.
                        </div>
                    `;
                }
            });
        }

        function openAddCategoryModal() {
            SwalDark.fire({
                title: 'Add New Category',
                html: `
                    <div style="text-align: left;">
                        <label style="font-size:0.8rem; color:var(--cyan-accent); display:block; margin-bottom:4px;">CATEGORY TITLE</label>
                        <input type="text" id="cat_title" class="swal2-input" placeholder="e.g. Battle Royale" style="width:100%; box-sizing:border-box; margin:0 0 15px 0; background:#0b061a; color:white; border:1px solid rgba(255,255,255,0.2);">
                        
                        <label style="font-size:0.8rem; color:var(--cyan-accent); display:block; margin-bottom:4px;">IMAGE URL</label>
                        <input type="text" id="cat_image" class="swal2-input" placeholder="https://image-url.com/pic.png" style="width:100%; box-sizing:border-box; margin:0; background:#0b061a; color:white; border:1px solid rgba(255,255,255,0.2);">
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'Save Category',
                confirmButtonColor: '#b026ff',
                cancelButtonColor: '#ff4757',
                preConfirm: () => {
                    const title = document.getElementById('cat_title').value.trim();
                    const image = document.getElementById('cat_image').value.trim();

                    if (!title) {
                        Swal.showValidationMessage('Please enter Category Title');
                        return false;
                    }
                    return { title: title, image: image };
                }
            }).then(result => {
                if (result.isConfirmed) {
                    db.ref('match_categories').push(result.value)
                        .then(() => SwalDark.fire('Created!', 'Category added successfully.', 'success'))
                        .catch(err => SwalDark.fire('Error', err.message, 'error'));
                }
            });
        }

        function deleteCategory(key) {
            SwalDark.fire({
                title: 'Delete Category?',
                text: 'This will not delete matches under it, but the category card will be removed.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ff4757',
                cancelButtonColor: '#332d48',
                confirmButtonText: 'Yes, Delete'
            }).then(res => {
                if (res.isConfirmed) {
                    db.ref('match_categories/' + key).remove()
                        .then(() => SwalDark.fire('Deleted!', 'Category removed.', 'success'))
                        .catch(err => SwalDark.fire('Error', err.message, 'error'));
                }
            });
        }
    </script>
</body>
</html>

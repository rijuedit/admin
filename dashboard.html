<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OXI ADMIN - Tournament Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0c0d18; color: #f1f5f9; }
        .heading-font { font-family: 'Rajdhani', sans-serif; }
        .admin-card { background-color: #15172a; border: 1px solid #222543; border-radius: 14px; }
        .main-container { background-color: #121425; border: 1px solid #1e223d; border-radius: 16px; }
        .nav-tab { background-color: #181a2e; border: 1px solid #232747; color: #94a3b8; transition: all 0.2s ease; }
        .nav-tab.active { background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%); color: #ffffff; border-color: #a78bfa; }
        .topup-card { background-color: #120a28; border: 1px solid #2a1b4d; border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
        .topup-card:hover { transform: scale(1.02); border-color: #7c3aed; }
        /* Custom Inputs for Match Add */
        .match-input { width: 100%; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; font-size: 14px; color: #374151; outline: none; }
        .match-input::placeholder { color: #9ca3af; text-transform: uppercase; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #222543; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- Top Navigation Header -->
    <header class="bg-[#121424] border-b border-[#1e223d] sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <span class="text-2xl font-bold heading-font tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500">
                OXI ADMIN
            </span>
            <div class="flex items-center gap-3">
                <button onclick="handleLogout()" class="bg-rose-600 text-white text-xs px-3.5 py-1.5 rounded-lg font-medium hover:bg-rose-700">Logout</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 mt-6">
        <!-- Tabs -->
        <div class="flex items-center gap-2 overflow-x-auto pb-3 mb-6">
            <button id="tab-matches" onclick="switchTab('matches')" class="nav-tab active px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap">
                <i class="fa-solid fa-gamepad"></i> Matches & Categories
            </button>
            <button id="tab-deposits" onclick="switchTab('deposits')" class="nav-tab px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap">
                <i class="fa-solid fa-credit-card"></i> Add Money Requests
            </button>
            <!-- Add other tabs similarly if needed -->
        </div>

        <!-- SECTION: MATCHES & CATEGORIES (TOP UP STYLE) -->
        <section id="section-matches" class="main-container p-6">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-bold heading-font text-white"><i class="fa-solid fa-gamepad text-purple-400"></i> Match Categories</h2>
                <button onclick="promptCreateCategory()" class="bg-purple-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-lg">
                    <i class="fa-solid fa-plus"></i> Add Category
                </button>
            </div>
            <!-- Category Grid (Exact Top Up Style 512x512 image structure) -->
            <div id="categoriesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                <!-- Dynamically Populated -->
            </div>
        </section>

        <!-- Other sections like users, deposits can remain hidden or added based on your old code -->
    </main>

    <!-- ========================================== -->
    <!-- MATCH MANAGEMENT OVERLAY (IMAGE 2) -->
    <!-- ========================================== -->
    <div id="matchManagementScreen" class="fixed inset-0 bg-black z-[100] hidden flex-col">
        <!-- Header -->
        <div class="flex items-center p-4 text-white border-b border-gray-900 bg-black">
            <i class="fa-solid fa-arrow-left text-xl mr-4 cursor-pointer" onclick="closeMatchManagement()"></i>
            <h1 class="text-xl font-medium">Match Management</h1>
            <div class="ml-auto text-xs text-gray-400" id="currentCatTitle"></div>
        </div>
        <!-- Tabs -->
        <div class="flex border-b border-gray-800 text-sm font-medium bg-black">
            <div class="flex-1 text-center py-3 text-[#3b82f6] border-b-2 border-[#3b82f6]">Matches</div>
            <div class="flex-1 text-center py-3 text-gray-500">Ongoing</div>
            <div class="flex-1 text-center py-3 text-gray-500">Results</div>
        </div>
        <!-- Matches List -->
        <div id="matchListContent" class="flex-1 overflow-y-auto p-4 space-y-3 bg-black">
            <!-- Matches populated here -->
        </div>
        <!-- FAB Button (+) -->
        <button onclick="openMatchAdd()" class="absolute bottom-8 right-6 w-14 h-14 bg-[#f3e8ff] rounded-2xl flex items-center justify-center text-black text-2xl shadow-lg hover:scale-105 transition-transform">
            <i class="fa-solid fa-plus"></i>
        </button>
    </div>

    <!-- ========================================== -->
    <!-- MATCH ADD OVERLAY (IMAGE 3 & 4) -->
    <!-- ========================================== -->
    <div id="matchAddScreen" class="fixed inset-0 bg-[#f5f5f5] z-[110] hidden flex-col font-sans">
        <!-- Header -->
        <div class="flex items-center p-4 bg-black text-white">
            <i class="fa-solid fa-arrow-left text-xl mr-4 cursor-pointer" onclick="closeMatchAdd()"></i>
            <h1 class="text-xl font-medium">Match Add</h1>
        </div>
        <!-- Form Body -->
        <div class="flex-1 overflow-y-auto p-4 space-y-3 pb-20">
            <input type="text" id="ma_title" placeholder="MATCH TITLE" class="match-input">
            
            <div class="flex gap-3">
                <input type="date" id="ma_date" class="match-input uppercase" title="MATCH DATE">
                <input type="time" id="ma_time" class="match-input uppercase" title="MATCH TIME">
            </div>
            
            <input type="time" id="ma_timer" class="match-input uppercase" placeholder="TIMER (24 Hours Format)" title="TIMER">
            
            <div class="flex gap-3">
                <input type="number" id="ma_prize" placeholder="WIN PRIZE" class="match-input uppercase">
                <input type="number" id="ma_perkill" placeholder="PER KILL" class="match-input uppercase">
                <input type="number" id="ma_fee" placeholder="ENTRY FEE" class="match-input uppercase">
            </div>
            
            <div class="flex gap-3 pt-1">
                <div class="flex-1 text-center text-xs font-bold text-black uppercase">Type</div>
                <div class="flex-1 text-center text-xs font-bold text-black uppercase">Version</div>
            </div>
            <div class="flex gap-3">
                <input type="text" id="ma_type" value="Solo" class="match-input text-center">
                <input type="text" id="ma_version" value="MOBILE" class="match-input text-center">
            </div>
            
            <div class="text-center text-xs font-bold text-black uppercase pt-1">Map</div>
            <input type="text" id="ma_map" value="Bermuda" class="match-input">
            
            <input type="number" id="ma_slots" placeholder="MATCH SLOTS" class="match-input uppercase">
            
            <textarea id="ma_details" placeholder="PRIZE DETAILS" class="match-input resize-none h-24"></textarea>
            
            <!-- Bottom Buttons -->
            <div class="flex gap-3 pt-4">
                <button onclick="closeMatchAdd()" class="flex-1 bg-[#e0e0e0] text-black font-bold py-3.5 rounded-lg text-sm">CANCEL</button>
                <button onclick="submitMatchAdd()" class="flex-1 bg-[#f59e0b] text-white font-bold py-3.5 rounded-lg text-sm shadow-md">CREATE</button>
            </div>
        </div>
    </div>


    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAkZkqcyP3P6QnbHT-wfxeygxgY9IoKBAU",
            authDomain: "oxi-esports.firebaseapp.com",
            databaseURL: "https://oxi-esports-default-rtdb.firebaseio.com",
            projectId: "oxi-esports",
            storageBucket: "oxi-esports.firebasestorage.app",
            messagingSenderId: "924353594492",
            appId: "1:924353594492:web:08329a3d1f67e7a5da35f9"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let currentActiveCategoryKey = null;

        const SwalDark = Swal.mixin({
            customClass: { popup: 'bg-[#15172a] text-white rounded-2xl', title: 'text-white font-bold', confirmButton: 'bg-purple-600 text-white px-4 py-2 rounded-xl mx-1' },
            buttonsStyling: false
        });

        auth.onAuthStateChanged(user => {
            if (!user) window.location.href = 'index.html';
            loadCategories();
        });

        function handleLogout() {
            auth.signOut().then(() => window.location.href = 'index.html');
        }

        // 1. Load Categories (Top-Up Style Cards)
        function loadCategories() {
            db.ref('match_categories').on('value', snapshot => {
                const categories = snapshot.val() || {};
                const grid = document.getElementById('categoriesGrid');
                grid.innerHTML = '';

                Object.entries(categories).forEach(([key, cat]) => {
                    const div = document.createElement('div');
                    div.className = 'topup-card relative';
                    
                    div.innerHTML = `
                        <div onclick="openMatchManagement('${key}', '${cat.title}')" class="relative pb-[100%] w-full bg-[#0b061c]">
                            <img src="${cat.image || 'https://via.placeholder.com/512'}" class="absolute inset-0 w-full h-full object-cover">
                        </div>
                        <div class="p-3 text-center text-white font-bold text-sm truncate flex justify-between items-center bg-[#120a28]">
                            <span onclick="openMatchManagement('${key}', '${cat.title}')" class="flex-1 text-left truncate">${cat.title}</span>
                            <i class="fa-solid fa-trash text-rose-500 hover:text-rose-400 text-xs p-1" onclick="deleteCategory('${key}')"></i>
                        </div>
                    `;
                    grid.appendChild(div);
                });
            });
        }

        async function promptCreateCategory() {
            const { value: formValues } = await SwalDark.fire({
                title: 'New Match Category',
                html: `
                    <input id="swal-cat-title" class="swal2-input bg-[#0c0d18] text-white border-gray-600" placeholder="Category Title">
                    <input id="swal-cat-img" class="swal2-input bg-[#0c0d18] text-white border-gray-600" placeholder="Image URL (512x512)">
                `,
                focusConfirm: false,
                preConfirm: () => {
                    return {
                        title: document.getElementById('swal-cat-title').value,
                        image: document.getElementById('swal-cat-img').value
                    }
                }
            });

            if (formValues && formValues.title) {
                await db.ref('match_categories').push(formValues);
            }
        }

        async function deleteCategory(key) {
            const confirm = await SwalDark.fire({ title: 'Delete Category?', showCancelButton: true });
            if (confirm.isConfirmed) await db.ref(`match_categories/${key}`).remove();
        }

        // 2. Match Management UI (Image 2)
        function openMatchManagement(catKey, catTitle) {
            currentActiveCategoryKey = catKey;
            document.getElementById('currentCatTitle').innerText = catTitle;
            document.getElementById('matchManagementScreen').style.display = 'flex';
            
            // Listen for matches in this category
            db.ref('matches').orderByChild('categoryKey').equalTo(catKey).on('value', snapshot => {
                const matches = snapshot.val() || {};
                const list = document.getElementById('matchListContent');
                list.innerHTML = '';
                
                Object.entries(matches).forEach(([mKey, m]) => {
                    const div = document.createElement('div');
                    div.className = 'bg-[#1a1a1a] rounded-xl p-4 border border-[#333] text-white relative';
                    div.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-bold text-lg">${m.title}</h3>
                            <span class="text-orange-400 font-bold bg-orange-500/10 px-2 py-1 rounded text-xs">৳${m.entryFee} Entry</span>
                        </div>
                        <div class="text-xs text-gray-400 grid grid-cols-2 gap-2 mb-3">
                            <div>Date: <span class="text-white">${m.matchDate}</span></div>
                            <div>Time: <span class="text-white">${m.matchTime}</span></div>
                            <div>Map: <span class="text-white">${m.map}</span></div>
                            <div>Type: <span class="text-white">${m.type}</span></div>
                            <div>Prize: <span class="text-green-400 font-bold">৳${m.winPrize}</span></div>
                            <div>Per Kill: <span class="text-white">৳${m.perKill}</span></div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="setRoomPrompt('${mKey}')" class="flex-1 bg-blue-600 py-1.5 rounded-lg text-xs font-bold">Set Room ID</button>
                            <button onclick="deleteMatch('${mKey}')" class="bg-red-600 px-3 py-1.5 rounded-lg text-xs font-bold"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                    list.appendChild(div);
                });
            });
        }

        function closeMatchManagement() {
            document.getElementById('matchManagementScreen').style.display = 'none';
            currentActiveCategoryKey = null;
        }

        // 3. Match Add UI (Image 3 & 4)
        function openMatchAdd() {
            document.getElementById('matchAddScreen').style.display = 'flex';
            // Clear inputs
            ['ma_title','ma_date','ma_time','ma_timer','ma_prize','ma_perkill','ma_fee','ma_slots','ma_details'].forEach(id => {
                document.getElementById(id).value = '';
            });
            document.getElementById('ma_type').value = 'Solo';
            document.getElementById('ma_version').value = 'MOBILE';
            document.getElementById('ma_map').value = 'Bermuda';
        }

        function closeMatchAdd() {
            document.getElementById('matchAddScreen').style.display = 'none';
        }

        async function submitMatchAdd() {
            const data = {
                categoryKey: currentActiveCategoryKey,
                title: document.getElementById('ma_title').value,
                matchDate: document.getElementById('ma_date').value,
                matchTime: document.getElementById('ma_time').value,
                timer: document.getElementById('ma_timer').value,
                winPrize: document.getElementById('ma_prize').value,
                perKill: document.getElementById('ma_perkill').value,
                entryFee: document.getElementById('ma_fee').value,
                type: document.getElementById('ma_type').value,
                version: document.getElementById('ma_version').value,
                map: document.getElementById('ma_map').value,
                slots: document.getElementById('ma_slots').value,
                prizeDetails: document.getElementById('ma_details').value,
                roomId: '', roomPassword: '', timestamp: Date.now()
            };

            if(!data.title || !data.entryFee) {
                SwalDark.fire('Error', 'Please fill the required fields (Title, Fee)', 'error');
                return;
            }

            await db.ref('matches').push(data);
            closeMatchAdd();
            SwalDark.fire('Success', 'Match Created!', 'success');
        }

        async function deleteMatch(mKey) {
            const c = await SwalDark.fire({title: 'Delete Match?', showCancelButton:true});
            if(c.isConfirmed) await db.ref(`matches/${mKey}`).remove();
        }

        async function setRoomPrompt(mKey) {
            const { value: formValues } = await SwalDark.fire({
                title: 'Set Room Credentials',
                html: `
                    <input id="swal-rid" class="swal2-input bg-black text-white" placeholder="Room ID">
                    <input id="swal-rpass" class="swal2-input bg-black text-white" placeholder="Room Password">
                `,
                preConfirm: () => ({ rid: document.getElementById('swal-rid').value, rpass: document.getElementById('swal-rpass').value })
            });
            if(formValues) {
                await db.ref(`matches/${mKey}`).update({ roomId: formValues.rid, roomPassword: formValues.rpass });
                SwalDark.fire('Saved', 'Room info updated', 'success');
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OXI ADMIN - Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #0b061a; --card: #160d2e; --cyan: #00ffd1; --purple: #b026ff; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; }
        .header { padding: 20px; background: var(--card); display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--purple); }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; padding: 20px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 12px; text-align: center; border: 1px solid rgba(0,255,209,0.1); }
        .stat-card i { font-size: 30px; color: var(--cyan); }
        
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; padding: 20px; }
        .menu-item { background: var(--purple); color: #fff; padding: 20px; border-radius: 12px; text-align: center; cursor: pointer; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .menu-item:hover { transform: scale(1.05); box-shadow: 0 0 15px var(--purple); }
        .logout { background: #ff4d4d !important; }
    </style>
</head>
<body>
    <div class="header">
        <h1>OXI ADMIN PANEL</h1>
        <button class="menu-item logout" onclick="auth.signOut()">Logout</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><i class="fas fa-users"></i><h3 id="s-u">0</h3><p>USERS</p></div>
        <div class="stat-card"><i class="fas fa-wallet"></i><h3 id="s-d">0</h3><p>PENDING DEPOSITS</p></div>
        <div class="stat-card"><i class="fas fa-gamepad"></i><h3 id="s-c">0</h3><p>CATEGORIES</p></div>
    </div>

    <div class="menu-grid">
        <a href="categories.html" class="menu-item"><i class="fas fa-gamepad"></i><br>Games & Matches</a>
        <a href="users.html" class="menu-item"><i class="fas fa-users"></i><br>Users & Bans</a>
        <a href="add-money.html" class="menu-item"><i class="fas fa-hand-holding-usd"></i><br>Add Money</a>
        <a href="banners.html" class="menu-item"><i class="fas fa-images"></i><br>App Banners</a>
        <a href="payment-settings.html" class="menu-item"><i class="fas fa-shield-alt"></i><br>Payment Settings</a>
        <a href="admins.html" class="menu-item"><i class="fas fa-user-shield"></i><br>Admin Management</a>
    </div>

    <script src="config.js"></script>
    <script>
        checkAuth();
        db.ref('users').on('value', s => document.getElementById('s-u').innerText = s.numChildren());
        db.ref('deposit_requests').on('value', s => {
            let count = 0;
            s.forEach(d => { if(d.val().status === 'pending') count++; });
            document.getElementById('s-d').innerText = count;
        });
        db.ref('match_categories').on('value', s => document.getElementById('s-c').innerText = s.numChildren());
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OXI ADMIN - Dashboard</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b021a; --card-bg: #150a2e; --primary: #9d00ff; --accent: #00ffcc;
            --text: #ffffff; --text-dim: #b0a3c4; --danger: #ff1744; --success: #00e676; --info: #2196f3;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); overflow-x: hidden; }

        header { background: var(--card-bg); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #25164d; position: sticky; top: 0; z-index: 1000; }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .role-badge { background: linear-gradient(45deg, #ff9800, #ff5722); font-size: 10px; padding: 3px 8px; border-radius: 10px; font-weight: bold; }
        .logout-btn { background: var(--danger); color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: 600; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; padding: 20px 5%; }
        .stat-card { background: var(--card-bg); padding: 20px; border-radius: 15px; text-align: center; border: 1px solid #25164d; }
        .stat-card i { font-size: 24px; color: var(--accent); margin-bottom: 10px; }

        .nav-tabs { display: flex; gap: 15px; padding: 10px 5%; overflow-x: auto; background: #0f0524; border-bottom: 1px solid #25164d; }
        .tab-btn { background: #25164d; color: var(--text-dim); border: none; padding: 10px 20px; border-radius: 20px; white-space: nowrap; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .tab-btn.active { background: var(--primary); color: white; }

        .main-content { padding: 30px 5%; }
        .tab-panel { display: none; animation: fadeIn 0.4s ease; }
        .tab-panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .section-header { margin-bottom: 20px; display: flex; align-items: center; gap: 10px; color: var(--accent); font-size: 18px; }
        .input-card { background: var(--card-bg); padding: 25px; border-radius: 15px; border: 1px solid #25164d; margin-bottom: 25px; }
        .input-group { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; margin-bottom: 15px; }
        input, select { background: #0b021a; border: 1px solid #3d2b63; padding: 12px 15px; color: white; border-radius: 8px; outline: none; flex: 1; }
        .action-btn { background: var(--accent); color: #000; border: none; padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* Tables */
        .table-container { overflow-x: auto; background: var(--card-bg); border-radius: 15px; border: 1px solid #25164d; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { text-align: left; padding: 15px; border-bottom: 1px solid #25164d; font-size: 14px; }
        th { background: #1c0e3d; color: var(--accent); }
        .btn-small { padding: 5px 10px; border-radius: 5px; border: none; font-size: 12px; cursor: pointer; font-weight: bold; margin-right: 5px; }
        .btn-edit { background: var(--info); color: white; }
        .btn-ban { background: #ff9800; color: white; }
        .btn-delete { background: var(--danger); color: white; }

        /* Admin Management Reference UI Styles */
        .info-box { background: #11052c; border-left: 4px solid var(--primary); padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; font-size: 13px; color: #d1c4e9; }
        .admin-action-btns { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .btn-add-super { background: var(--success); color: #000; border: none; padding: 14px; border-radius: 10px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-add-normal { background: var(--info); color: #fff; border: none; padding: 14px; border-radius: 10px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .admin-item-card { background: #180c38; border: 1px solid #2d1854; border-radius: 12px; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }

        /* Switches & Modals */
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(20px); }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); display: none; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(3px); }
        .modal-content { background: #150a2e; border: 1px solid #3d2b63; border-radius: 15px; width: 90%; max-width: 400px; padding: 25px; }

    </style>
</head>
<body>

    <header>
        <div class="logo-area"><h2>OXI ADMIN</h2> <span class="role-badge" id="admin-role-badge">LOADING...</span></div>
        <button class="logout-btn" onclick="auth.signOut()">Logout</button>
    </header>

    <div class="stats-grid">
        <div class="stat-card"><i class="fas fa-users"></i> <h3 id="total-users">0</h3> <p>Users</p></div>
        <div class="stat-card"><i class="fas fa-user-slash"></i> <h3 id="total-banned">0</h3> <p>Banned</p></div>
        <div class="stat-card"><i class="fas fa-image"></i> <h3 id="total-banners">0</h3> <p>Banners</p></div>
        <div class="stat-card"><i class="fas fa-gamepad"></i> <h3 id="total-categories">0</h3> <p>Games</p></div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchNav('games', this)" id="nav-games-btn"><i class="fas fa-gamepad"></i> Games</button>
        <button class="tab-btn" onclick="switchNav('users', this)" id="nav-users-btn"><i class="fas fa-users"></i> User List</button>
        <button class="tab-btn" onclick="switchNav('banned', this)" id="nav-banned-btn"><i class="fas fa-ban"></i> Banned</button>
        <button class="tab-btn" onclick="switchNav('banners', this)" id="nav-banners-btn"><i class="fas fa-image"></i> Banners</button>
        <button class="tab-btn" onclick="switchNav('payment', this)" id="nav-payment-btn"><i class="fas fa-wallet"></i> Payment</button>
        <button class="tab-btn" onclick="switchNav('admins', this)" id="nav-admins-btn" style="display:none;"><i class="fas fa-crown"></i> Admins</button>
    </div>

    <div class="main-content">
        <!-- Games Panel -->
        <div id="games-panel" class="tab-panel active">
            <div class="section-header"><i class="fas fa-plus-circle"></i> Create New Category</div>
            <div class="input-card"><div class="input-group"><input type="text" id="cat-title" placeholder="Category Name"><input type="text" id="cat-image" placeholder="Image URL"><button class="action-btn" onclick="addCategory()">ADD</button></div></div>
            <div id="categories-container" class="category-grid"></div>
        </div>

        <!-- Users List Panel -->
        <div id="users-panel" class="tab-panel">
            <div class="section-header"><i class="fas fa-users"></i> Registered Users Management</div>
            <div class="table-container">
                <table>
                    <thead><tr><th>Name</th><th>Email/Phone</th><th>Wallet (৳)</th><th>Actions</th></tr></thead>
                    <tbody id="users-list-body"></tbody>
                </table>
            </div>
        </div>

        <!-- Banned Panel -->
        <div id="banned-panel" class="tab-panel">
            <div class="section-header"><i class="fas fa-ban"></i> Banned Accounts</div>
            <div class="table-container">
                <table>
                    <thead><tr><th>Email</th><th>Reason</th><th>Actions</th></tr></thead>
                    <tbody id="banned-list-body"></tbody>
                </table>
            </div>
        </div>

        <!-- Admin Management -->
        <div id="admins-panel" class="tab-panel">
            <div class="section-header"><i class="fas fa-crown"></i> Admin Management</div>
            <div class="admin-action-btns">
                <button class="btn-add-super" onclick="promptAddAdmin('super')"><i class="fas fa-plus"></i> Add Super Admin</button>
                <button class="btn-add-normal" onclick="promptAddAdmin('normal')"><i class="fas fa-plus"></i> Add Normal Admin</button>
            </div>
            <div id="super-admins-list" class="admin-cards-list"></div>
            <div id="normal-admins-list" class="admin-cards-list"></div>
        </div>

        <!-- Payment Panel -->
        <div id="payment-panel" class="tab-panel">
            <div class="section-header"><i class="fas fa-wallet"></i> Payment & Auto Gateway</div>
            <div class="input-card">
                <div class="input-group"><input type="text" id="bkash-num" placeholder="bKash Num"><label class="switch"><input type="checkbox" id="bkash-toggle"><span class="slider"></span></label></div>
                <div class="input-group"><input type="text" id="nagad-num" placeholder="Nagad Num"><label class="switch"><input type="checkbox" id="nagad-toggle"><span class="slider"></span></label></div>
                <button class="action-btn" onclick="savePaymentSettings()" style="width:100%">SAVE</button>
            </div>
        </div>
    </div>

    <!-- Permission Modal -->
    <div id="perm-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="modal-email-title">Permissions</h3>
            <div id="modal-body"></div>
            <button class="action-btn" style="width:100%; margin-top:15px; background:var(--danger); color:white;" onclick="closePermModal()">Close</button>
        </div>
    </div>

    <script>
        const Popup = Swal.mixin({ background: '#150a2e', color: '#fff', confirmButtonColor: '#9d00ff' });
        const firebaseConfig = {
            apiKey: "AIzaSyAkZkqcyP3P6QnbHT-wfxeygxgY9IoKBAU",
            authDomain: "oxi-esports.firebaseapp.com",
            projectId: "oxi-esports",
            storageBucket: "oxi-esports.firebasestorage.app",
            messagingSenderId: "924353594492",
            appId: "1:924353594492:web:08329a3d1f67e7a5da35f9",
            databaseURL: "https://oxi-esports-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        let currentUserKey = "";
        let isSuper = false;

        function emailToKey(email) { return email ? email.replace(/\./g, ',') : ''; }
        function switchNav(id, btn) {
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id + '-panel').classList.add('active');
            btn.classList.add('active');
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUserKey = emailToKey(user.email);
                checkRole(currentUserKey);
            } else { window.location.href = 'index.html'; }
        });

        function checkRole(key) {
            db.ref(`superAdmins/${key}`).once('value', s => {
                if (s.exists()) {
                    isSuper = true;
                    document.getElementById('admin-role-badge').innerText = 'SUPER ADMIN';
                    document.getElementById('nav-admins-btn').style.display = 'flex';
                    init();
                } else {
                    db.ref(`admins/${key}`).once('value', s2 => {
                        if (s2.exists()) {
                            isSuper = false;
                            document.getElementById('admin-role-badge').innerText = 'ADMIN';
                            init();
                        } else { auth.signOut(); }
                    });
                }
            });
        }

        function init() {
            fetchStats();
            fetchCategories();
            fetchUsers();
            fetchBanned();
            loadPayment();
            if (isSuper) fetchAdmins();
        }

        function fetchStats() {
            db.ref('users').on('value', s => document.getElementById('total-users').innerText = s.numChildren());
            db.ref('bannedUsers').on('value', s => document.getElementById('total-banned').innerText = s.numChildren());
            db.ref('match_categories').on('value', s => document.getElementById('total-categories').innerText = s.numChildren());
        }

        // --- User Management ---
        function fetchUsers() {
            db.ref('users').on('value', snapshot => {
                const body = document.getElementById('users-list-body');
                body.innerHTML = '';
                snapshot.forEach(child => {
                    const u = child.val();
                    const key = child.key;
                    body.innerHTML += `
                        <tr>
                            <td><b>${u.name || 'N/A'}</b></td>
                            <td>${u.email}<br><small>${u.phone || ''}</small></td>
                            <td>৳ ${u.wallet || 0}</td>
                            <td>
                                <button class="btn-small btn-edit" onclick="editBalance('${key}', ${u.wallet || 0})">Wallet</button>
                                <button class="btn-small btn-ban" onclick="banUser('${key}', '${u.email}')">Ban</button>
                                <button class="btn-small btn-delete" onclick="deleteUser('${key}')"><i class="fas fa-trash"></i></button>
                            </td>
                        </tr>`;
                });
            });
        }

        function editBalance(key, current) {
            Popup.fire({
                title: 'Edit Wallet Balance',
                input: 'number',
                inputValue: current,
                showCancelButton: true
            }).then(res => {
                if (res.isConfirmed) db.ref(`users/${key}/wallet`).set(parseFloat(res.value));
            });
        }

        function banUser(key, email) {
            Popup.fire({ title: 'Ban Reason?', input: 'text', showCancelButton: true }).then(res => {
                if (res.isConfirmed) {
                    db.ref(`bannedUsers/${emailToKey(email)}`).set({ email, reason: res.value, uid: key })
                    .then(() => Popup.fire('Banned!', '', 'success'));
                }
            });
        }

        function deleteUser(key) {
            if (confirm("Delete this user permanently?")) db.ref(`users/${key}`).remove();
        }

        function fetchBanned() {
            db.ref('bannedUsers').on('value', snapshot => {
                const body = document.getElementById('banned-list-body');
                body.innerHTML = '';
                snapshot.forEach(child => {
                    const b = child.val();
                    body.innerHTML += `<tr><td>${b.email}</td><td>${b.reason}</td><td><button class="btn-small btn-edit" onclick="unban('${child.key}')">Unban</button></td></tr>`;
                });
            });
        }
        function unban(key) { db.ref(`bannedUsers/${key}`).remove(); }

        // --- Category Management ---
        function addCategory() {
            const title = document.getElementById('cat-title').value;
            const img = document.getElementById('cat-image').value;
            if (title && img) db.ref('match_categories').push({ title, image: img });
        }
        function fetchCategories() {
            db.ref('match_categories').on('value', s => {
                const container = document.getElementById('categories-container');
                container.innerHTML = '';
                s.forEach(c => {
                    container.innerHTML += `<div class="stat-card" style="margin-bottom:10px;"><img src="${c.val().image}" width="50"><p>${c.val().title}</p><button onclick="db.ref('match_categories/${c.key}').remove()">Del</button></div>`;
                });
            });
        }

        // --- Admin Management ---
        function fetchAdmins() {
            db.ref('superAdmins').on('value', s1 => {
                db.ref('admins').on('value', s2 => {
                    const sup = document.getElementById('super-admins-list');
                    const norm = document.getElementById('normal-admins-list');
                    sup.innerHTML = ''; norm.innerHTML = '';
                    s1.forEach(c => {
                        const isYou = c.key === currentUserKey;
                        sup.innerHTML += `<div class="admin-item-card"><span>${c.key.replace(/,/g,'.')} (Super)</span> ${isYou ? '<b>(You)</b>' : `<button onclick="db.ref('superAdmins/${c.key}').remove()">Rem</button>`}</div>`;
                    });
                    s2.forEach(c => {
                        norm.innerHTML += `<div class="admin-item-card"><span>${c.key.replace(/,/g,'.')}</span> <button onclick="openPerms('${c.key}')">Perms</button><button onclick="db.ref('admins/${c.key}').remove()">Rem</button></div>`;
                    });
                });
            });
        }
        function promptAddAdmin(type) {
            Popup.fire({ title: 'Admin Email', input: 'email', showCancelButton: true }).then(res => {
                if (res.isConfirmed) db.ref(`${type === 'super' ? 'superAdmins' : 'admins'}/${emailToKey(res.value)}`).set(true);
            });
        }

        function loadPayment() {
            db.ref('paymentSettings').on('value', s => {
                const d = s.val() || {};
                document.getElementById('bkash-num').value = d.bkash || '';
                document.getElementById('bkash-toggle').checked = d.bkashActive;
            });
        }
        function savePaymentSettings() {
            db.ref('paymentSettings').update({ bkash: document.getElementById('bkash-num').value, bkashActive: document.getElementById('bkash-toggle').checked });
        }
        function closePermModal() { document.getElementById('perm-modal').style.display = 'none'; }
    </script>
</body>
</html>

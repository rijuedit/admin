<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OXI ADMIN - Login</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background: #0b061a; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #160d2e; padding: 40px; border-radius: 20px; border: 1px solid #b026ff; width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #b026ff; border: none; color: #fff; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2 style="color:#00ffd1">OXI ADMIN</h2>
        <p>Login to your account</p>
        <input type="email" id="email" placeholder="Admin Email">
        <input type="password" id="pass" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>

    <script src="config.js"></script>
    <script>
        function login() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            
            auth.signInWithEmailAndPassword(email, pass).then(userCredential => {
                const eKey = emailToKey(email);
                // Check if admin or superAdmin
                db.ref('admins/' + eKey).once('value', s1 => {
                    db.ref('superAdmins/' + eKey).once('value', s2 => {
                        if (s1.exists() || s2.exists()) {
                            window.location.href = "dashboard.html";
                        } else {
                            auth.signOut();
                            Swal.fire('Access Denied', 'You are not an admin', 'error');
                        }
                    });
                });
            }).catch(err => Swal.fire('Error', err.message, 'error'));
        }
    </script>
</body>
</html>

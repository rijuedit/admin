<!-- Admin/admins.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Management - OXI E-Sports</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Configuration JS -->
    <script src="config.js"></script>
    <style>
        :root {
            --bg-color: #0b061a;
            --card-bg: #160d2e;
            --cyan-accent: #00ffd1;
            --purple-glow: #b026ff;
            --text-color: #ffffff;
            --text-muted: #a098c0;
            --danger-color: #ff4757;
            --border-color: rgba(255, 255, 255, 0.08);
            --info-bg: #221445;
            --btn-green: #10b981;
            --btn-blue: #3b82f6;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            min-height: 100vh;
        }

        /* Top Bar Navigation */
        .top-nav {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-dashboard {
            background: transparent;
            border: 1px solid var(--cyan-accent);
            color: var(--cyan-accent);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-dashboard:hover {
            background: var(--cyan-accent);
            color: var(--bg-color);
            box-shadow: 0 0 15px rgba(0, 255, 209, 0.4);
        }

        /* Main Glass Card */
        .glass-card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 900px;
            margin: 0 auto;
        }

        .card-header h2 {
            margin: 0 0 20px 0;
            font-size: 1.4rem;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Info Box */
        .info-box {
            background: var(--info-bg);
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        
        .info-box div {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Add Buttons */
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .action-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: opacity 0.3s;
        }

        .action-buttons button:hover {
            opacity: 0.85;
        }

        .btn-add-super { background: var(--btn-green); }
        .btn-add-normal { background: var(--btn-blue); }

        /* Section Titles */
        .section-title {
            font-size: 1.1rem;
            color: white;
            margin: 25px 0 15px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title.super { color: #ffc107; }
        .section-title.normal { color: #60a5fa; }

        /* Admin List Items */
        .admin-list-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .admin-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 15px 20px;
            border-radius: 8px;
        }

        .admin-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .admin-email {
            font-weight: bold;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-email .crown { color: #ffc107; }
        .admin-email .wrench { color: var(--text-muted); }

        .admin-role-text {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Action Buttons inside List */
        .btn-remove {
            background: #ff3b30;
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-permission {
            background: var(--btn-blue);
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-right: 8px;
        }

        .text-protected {
            color: #ffc107;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        /* Permission Checkboxes Modal Styling */
        .perm-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            text-align: left;
            margin-top: 15px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .perm-grid::-webkit-scrollbar { width: 5px; }
        .perm-grid::-webkit-scrollbar-thumb { background: #332d48; border-radius: 5px; }

        .perm-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .perm-item span {
            color: var(--text-color);
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* Custom Switch Toggle */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #332d48; transition: .3s; border-radius: 22px;
        }

        .slider:before {
            position: absolute; content: "";
            height: 16px; width: 16px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--cyan-accent); }
        input:checked + .slider:before { transform: translateX(22px); background-color: #0b061a; }
    </style>
</head>
<body>

    <!-- Navigation Header -->
    <div class="top-nav">
        <a href="dashboard.html" class="btn-dashboard">
            <i class="fas fa-arrow-left"></i> Dashboard
        </a>
    </div>

    <!-- Main Container Card -->
    <div class="glass-card">
        <div class="card-header">
            <h2>👑 Admin Management</h2>
        </div>

        <!-- Info Box -->
        <div class="info-box">
            <div><i class="fas fa-lightbulb" style="color: #ffc107;"></i> <strong>Super Admin:</strong> সব কাজ + Wallet manage + Admin manage</div>
            <div style="margin-top: 8px;"><i class="fas fa-lightbulb" style="color: #ffc107;"></i> <strong>Normal Admin:</strong> শুধু order/payment/product/ban manage</div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button class="btn-add-super" onclick="openAddSuperAdminModal()">
                <i class="fas fa-plus"></i> Add Super Admin
            </button>
            <button class="btn-add-normal" onclick="openAddNormalAdminModal()">
                <i class="fas fa-plus"></i> Add Normal Admin
            </button>
        </div>

        <!-- Super Admins List -->
        <h3 class="section-title super"><i class="fas fa-crown"></i> Super Admins</h3>
        <div id="superAdminsList" class="admin-list-container">
            <div style="text-align: center; color: var(--text-muted); padding: 20px;">
                <i class="fas fa-spinner fa-spin"></i> Loading...
            </div>
        </div>

        <!-- Normal Admins List -->
        <h3 class="section-title normal"><i class="fas fa-wrench"></i> Normal Admins</h3>
        <div id="normalAdminsList" class="admin-list-container">
            <div style="text-align: center; color: var(--text-muted); padding: 20px;">
                <i class="fas fa-spinner fa-spin"></i> Loading...
            </div>
        </div>
    </div>

    <script>
        let currentUserEmail = '';

        // Monitor Auth State
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUserEmail = user.email;
                verifySuperAdminAccess();
            } else {
                window.location.href = 'login.html';
            }
        });

        // Verify Super Admin Authorization
        function verifySuperAdminAccess() {
            const userKey = emailToKey(currentUserEmail);
            db.ref('superAdmins/' + userKey).once('value', snapshot => {
                if (snapshot.exists()) {
                    loadAdminsList();
                } else {
                    SwalDark.fire({
                        icon: 'error',
                        title: 'Access Denied',
                        text: 'Only Super Admins can manage System Admin permissions.'
                    }).then(() => {
                        window.location.href = 'dashboard.html';
                    });
                }
            });
        }

        // Fetch and Render Admins List
        function loadAdminsList() {
            const adminsRef = db.ref('admins');
            const superAdminsRef = db.ref('superAdmins');

            Promise.all([superAdminsRef.once('value'), adminsRef.once('value')])
                .then(([superSnap, adminSnap]) => {
                    const superListDiv = document.getElementById('superAdminsList');
                    const normalListDiv = document.getElementById('normalAdminsList');
                    
                    superListDiv.innerHTML = '';
                    normalListDiv.innerHTML = '';

                    const superAdmins = superSnap.val() || {};
                    const normalAdmins = adminSnap.val() || {};

                    // 1. Render Super Admins
                    let superCount = 0;
                    Object.keys(superAdmins).forEach(key => {
                        superCount++;
                        const email = superAdmins[key].email || key.replace(/,/g, '.');
                        const isSelf = (email.toLowerCase() === currentUserEmail.toLowerCase());

                        superListDiv.innerHTML += `
                            <div class="admin-item">
                                <div class="admin-info">
                                    <div class="admin-email"><i class="fas fa-crown crown"></i> ${email}</div>
                                    <div class="admin-role-text">Super Admin ${isSelf ? '(You)' : ''}</div>
                                </div>
                                <div class="admin-actions">
                                    ${!isSelf ? `
                                        <button class="btn-remove" onclick="removeSuperAdmin('${key}', '${email}')">
                                            <i class="fas fa-trash-alt"></i> Remove
                                        </button>
                                    ` : '<span class="text-protected"><i class="fas fa-lock"></i> You</span>'}
                                </div>
                            </div>
                        `;
                    });

                    if (superCount === 0) {
                        superListDiv.innerHTML = `<div style="text-align:center; color: #a098c0; padding: 10px;">No Super Admins found.</div>`;
                    }

                    // 2. Render Normal Admins
                    let normalCount = 0;
                    Object.keys(normalAdmins).forEach(key => {
                        normalCount++;
                        const adminObj = normalAdmins[key];
                        const email = adminObj.email || key.replace(/,/g, '.');

                        normalListDiv.innerHTML += `
                            <div class="admin-item">
                                <div class="admin-info">
                                    <div class="admin-email"><i class="fas fa-wrench wrench"></i> ${email}</div>
                                    <div class="admin-role-text">Normal Admin</div>
                                </div>
                                <div class="admin-actions">
                                    <button class="btn-permission" onclick="openPermissionsModal('${key}', '${email}')">
                                        <i class="fas fa-sliders-h"></i> Permissions
                                    </button>
                                    <button class="btn-remove" onclick="removeNormalAdmin('${key}', '${email}')">
                                        <i class="fas fa-trash-alt"></i> Remove
                                    </button>
                                </div>
                            </div>
                        `;
                    });

                    if (normalCount === 0) {
                        normalListDiv.innerHTML = `<div style="text-align:center; color: #a098c0; padding: 10px;">No Normal Admins found.</div>`;
                    }
                })
                .catch(err => {
                    SwalDark.fire('Error', 'Failed to load system admin list.', 'error');
                });
        }

        // Modal: Add Super Admin
        function openAddSuperAdminModal() {
            SwalDark.fire({
                title: '<i class="fas fa-crown" style="color: #ffc107;"></i> Add Super Admin',
                html: `
                    <div style="text-align: left; margin-top: 10px;">
                        <label style="font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 5px;">Admin Email Address</label>
                        <input type="email" id="newAdminEmail" class="swal2-input" placeholder="superadmin@example.com" style="width: 100%; box-sizing: border-box; margin: 0 0 15px 0; background: #0b061a; color: white; border: 1px solid rgba(255,255,255,0.2);">
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'Add Super Admin',
                confirmButtonColor: '#10b981',
                cancelButtonColor: '#ff4757',
                preConfirm: () => {
                    const email = document.getElementById('newAdminEmail').value.trim();
                    if (!email) {
                        Swal.showValidationMessage('Please enter a valid email address');
                        return false;
                    }
                    return email;
                }
            }).then(result => {
                if (result.isConfirmed) {
                    const email = result.value;
                    const key = emailToKey(email);

                    // Remove from Normal admin if exists, then add to Super admin
                    db.ref('admins/' + key).remove().then(() => {
                        db.ref('superAdmins/' + key).set({
                            email: email,
                            addedAt: firebase.database.ServerValue.TIMESTAMP
                        }).then(() => {
                            SwalDark.fire('Added!', `${email} is now a Super Admin.`, 'success');
                            loadAdminsList();
                        }).catch(err => SwalDark.fire('Error', err.message, 'error'));
                    });
                }
            });
        }

        // Modal: Add Normal Admin
        function openAddNormalAdminModal() {
            SwalDark.fire({
                title: '<i class="fas fa-wrench" style="color: #60a5fa;"></i> Add Normal Admin',
                html: `
                    <div style="text-align: left; margin-top: 10px;">
                        <label style="font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 5px;">Admin Email Address</label>
                        <input type="email" id="newAdminEmail" class="swal2-input" placeholder="admin@example.com" style="width: 100%; box-sizing: border-box; margin: 0 0 15px 0; background: #0b061a; color: white; border: 1px solid rgba(255,255,255,0.2);">
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'Add Normal Admin',
                confirmButtonColor: '#3b82f6',
                cancelButtonColor: '#ff4757',
                preConfirm: () => {
                    const email = document.getElementById('newAdminEmail').value.trim();
                    if (!email) {
                        Swal.showValidationMessage('Please enter a valid email address');
                        return false;
                    }
                    return email;
                }
            }).then(result => {
                if (result.isConfirmed) {
                    const email = result.value;
                    const key = emailToKey(email);

                    // Check if already super admin
                    db.ref('superAdmins/' + key).once('value', sSnap => {
                        if (sSnap.exists()) {
                            SwalDark.fire('Notice', 'This user is already a Super Admin!', 'info');
                            return;
                        }

                        const defaultPermissions = {
                            appSettings: true,
                            paymentSettings: true,
                            users: true,
                            addMoney: true,
                            banners: true,
                            categories: true,
                            matches: true
                        };

                        db.ref('admins/' + key).set({
                            email: email,
                            addedAt: firebase.database.ServerValue.TIMESTAMP,
                            permissions: defaultPermissions
                        }).then(() => {
                            SwalDark.fire('Added!', `${email} is now a Normal Admin.`, 'success');
                            loadAdminsList();
                        }).catch(err => {
                            SwalDark.fire('Error', err.message, 'error');
                        });
                    });
                }
            });
        }

        // Remove Super Admin
        function removeSuperAdmin(adminKey, adminEmail) {
            SwalDark.fire({
                title: 'Are you sure?',
                text: `Remove ${adminEmail} from Super Admins?`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ff4757',
                cancelButtonColor: '#332d48',
                confirmButtonText: 'Yes, Remove'
            }).then(result => {
                if (result.isConfirmed) {
                    db.ref('superAdmins/' + adminKey).remove()
                        .then(() => {
                            SwalDark.fire('Removed', 'Super Admin removed successfully.', 'success');
                            loadAdminsList();
                        })
                        .catch(err => SwalDark.fire('Error', err.message, 'error'));
                }
            });
        }

        // Remove Normal Admin
        function removeNormalAdmin(adminKey, adminEmail) {
            SwalDark.fire({
                title: 'Are you sure?',
                text: `Remove ${adminEmail} from Normal Admins?`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ff4757',
                cancelButtonColor: '#332d48',
                confirmButtonText: 'Yes, Remove'
            }).then(result => {
                if (result.isConfirmed) {
                    db.ref('admins/' + adminKey).remove()
                        .then(() => {
                            SwalDark.fire('Removed', 'Normal Admin removed successfully.', 'success');
                            loadAdminsList();
                        })
                        .catch(err => SwalDark.fire('Error', err.message, 'error'));
                }
            });
        }

        // Permissions Modal for Normal Admins
        function openPermissionsModal(adminKey, adminEmail) {
            db.ref('admins/' + adminKey + '/permissions').once('value', snapshot => {
                const perms = snapshot.val() || {};
                
                const isAppSetChecked = perms.appSettings !== false; 
                const isPaySetChecked = perms.paymentSettings !== false;
                const isUserChecked = perms.users !== false;
                const isAddMonChecked = perms.addMoney !== false;
                const isBanChecked = perms.banners !== false;
                const isCatChecked = perms.categories !== false;
                const isMatchChecked = perms.matches !== false;

                SwalDark.fire({
                    title: '<i class="fas fa-sliders-h" style="color: #60a5fa;"></i> Admin Permissions',
                    html: `
                        <div style="text-align: left; margin-bottom: 15px; font-size: 0.9rem; color: var(--text-muted);">
                            Configuring access rights for: <br><strong style="color: #60a5fa;">${adminEmail}</strong>
                        </div>
                        <div class="perm-grid">
                            <div class="perm-item">
                                <span><i class="fas fa-mobile-alt"></i> App Settings</span>
                                <label class="switch">
                                    <input type="checkbox" id="perm_appSettings" ${isAppSetChecked ? 'checked' : ''}>
                                    <span class="slider"></span>
                                </label>
                            </div>
                            <div class="perm-item">
                                <span><i class="fas fa-sliders-h"></i> Payment Settings</span>
                                <label class="switch">
                                    <input type="checkbox" id="perm_payment" ${isPaySetChecked ? 'checked' : ''}>
                                    <span class="slider"></span>
                                </label>
                            </div>
                            <div class="perm-item">
                                <span><i class="fas fa-users"></i> Users Management</span>
                                <label class="switch">
                                    <input type="checkbox" id="perm_users" ${isUserChecked ? 'checked' : ''}>
                                    <span class="slider"></span>
                                </label>
                            </div>
                            <div class="perm-item">
                                <span><i class="fas fa-wallet"></i> Deposit Requests</span>
                                <label class="switch">
                                    <input type="checkbox" id="perm_addMoney" ${isAddMonChecked ? 'checked' : ''}>
                                    <span class="slider"></span>
                                </label>
                            </div>
                            <div class="perm-item">
                                <span><i class="fas fa-images"></i> Manage Banners</span>
                                <label class="switch">
                                    <input type="checkbox" id="perm_banners" ${isBanChecked ? 'checked' : ''}>
                                    <span class="slider"></span>
                                </label>
                            </div>
                            <div class="perm-item">
                                <span><i class="fas fa-list"></i> Manage Categories</span>
                                <label class="switch">
                                    <input type="checkbox" id="perm_categories" ${isCatChecked ? 'checked' : ''}>
                                    <span class="slider"></span>
                                </label>
                            </div>
                            <div class="perm-item">
                                <span><i class="fas fa-gamepad"></i> Manage Matches</span>
                                <label class="switch">
                                    <input type="checkbox" id="perm_matches" ${isMatchChecked ? 'checked' : ''}>
                                    <span class="slider"></span>
                                </label>
                            </div>
                        </div>
                    `,
                    showCancelButton: true,
                    confirmButtonText: 'Save Permissions',
                    cancelButtonText: 'Cancel',
                    confirmButtonColor: '#b026ff',
                    cancelButtonColor: '#ff4757',
                    preConfirm: () => {
                        return {
                            appSettings: document.getElementById('perm_appSettings').checked,
                            paymentSettings: document.getElementById('perm_payment').checked,
                            users: document.getElementById('perm_users').checked,
                            addMoney: document.getElementById('perm_addMoney').checked,
                            banners: document.getElementById('perm_banners').checked,
                            categories: document.getElementById('perm_categories').checked,
                            matches: document.getElementById('perm_matches').checked
                        };
                    }
                }).then(result => {
                    if (result.isConfirmed) {
                        db.ref('admins/' + adminKey + '/permissions').set(result.value)
                            .then(() => {
                                SwalDark.fire('Success', 'Permissions updated successfully!', 'success');
                                loadAdminsList();
                            })
                            .catch(err => SwalDark.fire('Error', err.message, 'error'));
                    }
                });
            });
        }
    </script>
</body>
</html>

<!-- Admin/admins.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Management - OXI E-Sports</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Configuration JS -->
    <script src="config.js"></script>
    <style>
        :root {
            --bg-color: #0b061a;
            --card-bg: #160d2e;
            --cyan-accent: #00ffd1;
            --purple-glow: #b026ff;
            --text-color: #ffffff;
            --text-muted: #a098c0;
            --danger-color: #ff4757;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            min-height: 100vh;
        }

        /* Top Bar Navigation */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .btn-dashboard {
            background: transparent;
            border: 1px solid var(--cyan-accent);
            color: var(--cyan-accent);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-dashboard:hover {
            background: var(--cyan-accent);
            color: var(--bg-color);
            box-shadow: 0 0 15px rgba(0, 255, 209, 0.4);
        }

        .btn-add-admin {
            background: linear-gradient(135deg, #8a2be2, #b026ff);
            border: none;
            color: white;
            padding: 10px 22px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 15px rgba(176, 38, 255, 0.4);
            transition: all 0.3s ease;
        }

        .btn-add-admin:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(176, 38, 255, 0.7);
        }

        /* Main Glass Card */
        .glass-card {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            padding: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .card-header h2 {
            margin: 0;
            font-size: 1.4rem;
            color: var(--cyan-accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge-count {
            background: rgba(0, 255, 209, 0.1);
            color: var(--cyan-accent);
            border: 1px solid rgba(0, 255, 209, 0.3);
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
        }

        /* Admin Table */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            padding: 14px 16px;
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
            font-size: 0.95rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* Badges */
        .role-super {
            background: linear-gradient(135deg, #ff9f43, #ff5252);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .role-admin {
            background: rgba(0, 255, 209, 0.15);
            color: var(--cyan-accent);
            border: 1px solid rgba(0, 255, 209, 0.4);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .badge-you {
            background: rgba(176, 38, 255, 0.2);
            color: var(--purple-glow);
            border: 1px solid rgba(176, 38, 255, 0.4);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.7rem;
            margin-left: 8px;
        }

        /* Action Buttons */
        .action-cell {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-permission {
            background: rgba(0, 255, 209, 0.1);
            border: 1px solid var(--cyan-accent);
            color: var(--cyan-accent);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-permission:hover {
            background: var(--cyan-accent);
            color: var(--bg-color);
            box-shadow: 0 0 10px rgba(0, 255, 209, 0.4);
        }

        .btn-remove {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid var(--danger-color);
            color: var(--danger-color);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-remove:hover {
            background: var(--danger-color);
            color: white;
            box-shadow: 0 0 10px rgba(255, 71, 87, 0.4);
        }

        .text-protected {
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.85rem;
        }

        /* Permission Checkboxes Modal Styling */
        .perm-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            text-align: left;
            margin-top: 15px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }

        /* Custom Scrollbar for Modal Grid */
        .perm-grid::-webkit-scrollbar { width: 5px; }
        .perm-grid::-webkit-scrollbar-thumb { background: #332d48; border-radius: 5px; }

        .perm-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .perm-item span {
            color: var(--text-color);
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* Custom Switch Toggle */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #332d48;
            transition: .3s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--cyan-accent);
        }

        input:checked + .slider:before {
            transform: translateX(22px);
            background-color: #0b061a;
        }
    </style>
</head>
<body>

    <!-- Navigation Header -->
    <div class="top-nav">
        <a href="dashboard.html" class="btn-dashboard">
            <i class="fas fa-arrow-left"></i> Dashboard
        </a>
        <button class="btn-add-admin" onclick="openAddAdminModal()">
            <i class="fas fa-user-plus"></i> Add New Admin
        </button>
    </div>

    <!-- Main Container Card -->
    <div class="glass-card">
        <div class="card-header">
            <h2><i class="fas fa-user-shield"></i> System Admins</h2>
            <div class="badge-count"><span id="totalAdminCount">0</span> Admins Total</div>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Admin Email</th>
                        <th>Role</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="adminsTableBody">
                    <tr>
                        <td colspan="3" style="text-align: center; color: var(--text-muted); padding: 30px;">
                            <i class="fas fa-spinner fa-spin fa-2x"></i><br><br>Loading System Admins...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let currentUserEmail = '';

        // Monitor Auth State
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUserEmail = user.email;
                verifySuperAdminAccess();
            } else {
                window.location.href = 'login.html';
            }
        });

        // Verify Super Admin Authorization
        function verifySuperAdminAccess() {
            const userKey = emailToKey(currentUserEmail);
            db.ref('superAdmins/' + userKey).once('value', snapshot => {
                if (snapshot.exists()) {
                    loadAdminsList();
                } else {
                    SwalDark.fire({
                        icon: 'error',
                        title: 'Access Denied',
                        text: 'Only Super Admins can manage System Admin permissions.'
                    }).then(() => {
                        window.location.href = 'dashboard.html';
                    });
                }
            });
        }

        // Fetch and Render Admins List
        function loadAdminsList() {
            const adminsRef = db.ref('admins');
            const superAdminsRef = db.ref('superAdmins');

            Promise.all([superAdminsRef.once('value'), adminsRef.once('value')])
                .then(([superSnap, adminSnap]) => {
                    const tableBody = document.getElementById('adminsTableBody');
                    tableBody.innerHTML = '';

                    const superAdmins = superSnap.val() || {};
                    const normalAdmins = adminSnap.val() || {};

                    let totalCount = 0;
                    let rowsHtml = '';

                    // 1. Render Super Admins first
                    Object.keys(superAdmins).forEach(key => {
                        totalCount++;
                        const email = superAdmins[key].email || key.replace(/,/g, '.');
                        const isSelf = (email.toLowerCase() === currentUserEmail.toLowerCase());

                        rowsHtml += `
                            <tr>
                                <td>
                                    <i class="fas fa-envelope" style="color: var(--text-muted); margin-right: 8px;"></i>
                                    <strong>${email}</strong>
                                    ${isSelf ? '<span class="badge-you">YOU</span>' : ''}
                                </td>
                                <td>
                                    <span class="role-super"><i class="fas fa-crown"></i> SUPER ADMIN</span>
                                </td>
                                <td>
                                    <span class="text-protected"><i class="fas fa-lock"></i> Protected</span>
                                </td>
                            </tr>
                        `;
                    });

                    // 2. Render Normal Admins next
                    Object.keys(normalAdmins).forEach(key => {
                        totalCount++;
                        const adminObj = normalAdmins[key];
                        const email = adminObj.email || key.replace(/,/g, '.');
                        const isSelf = (email.toLowerCase() === currentUserEmail.toLowerCase());

                        rowsHtml += `
                            <tr>
                                <td>
                                    <i class="fas fa-envelope" style="color: var(--text-muted); margin-right: 8px;"></i>
                                    <strong>${email}</strong>
                                    ${isSelf ? '<span class="badge-you">YOU</span>' : ''}
                                </td>
                                <td>
                                    <span class="role-admin"><i class="fas fa-shield-alt"></i> ADMIN</span>
                                </td>
                                <td>
                                    <div class="action-cell">
                                        <button class="btn-permission" onclick="openPermissionsModal('${key}', '${email}')">
                                            <i class="fas fa-sliders-h"></i> Permissions
                                        </button>
                                        ${!isSelf ? `
                                            <button class="btn-remove" onclick="removeAdmin('${key}', '${email}')">
                                                <i class="fas fa-trash-alt"></i> Remove
                                            </button>
                                        ` : '<span class="text-protected"><i class="fas fa-lock"></i> Protected</span>'}
                                    </div>
                                </td>
                            </tr>
                        `;
                    });

                    document.getElementById('totalAdminCount').innerText = totalCount;

                    if (totalCount === 0) {
                        tableBody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding: 20px;">No admins found.</td></tr>`;
                    } else {
                        tableBody.innerHTML = rowsHtml;
                    }
                })
                .catch(err => {
                    SwalDark.fire('Error', 'Failed to load system admin list.', 'error');
                });
        }

        // Modal: Manage Permissions for a Normal Admin
        function openPermissionsModal(adminKey, adminEmail) {
            db.ref('admins/' + adminKey + '/permissions').once('value', snapshot => {
                const perms = snapshot.val() || {};
                
                // Defaults for missing permissions (newly added modules)
                const isAppSetChecked = perms.appSettings !== false; 
                const isPaySetChecked = perms.paymentSettings !== false;
                const isUserChecked = perms.users !== false;
                const isAddMonChecked = perms.addMoney !== false;
                const isBanChecked = perms.banners !== false;
                const isCatChecked = perms.categories !== false;
                const isMatchChecked = perms.matches !== false;

                SwalDark.fire({
                    title: '<i class="fas fa-user-cog" style="color: var(--cyan-accent);"></i> Admin Permissions',
                    html: `
                        <div style="text-align: left; margin-bottom: 15px; font-size: 0.9rem; color: var(--text-muted);">
                            Configuring access rights for: <br><strong style="color: var(--cyan-accent);">${adminEmail}</strong>
                        </div>
                        <div class="perm-grid">
                            <!-- Newly Added App Settings -->
                            <div class="perm-item">
                                <span><i class="fas fa-mobile-alt"></i> App Settings (Notice/Support)</span>
                                <label class="switch">
                                    <input type="checkbox" id="perm_appSettings" ${isAppSetChecked ? 'checked' : ''}>
                                    <span class="slider"></span>
                                </label>
                            </div>
                            <div class="perm-item">
                                <span><i class="fas fa-sliders-h"></i> Payment Settings</span>
                                <label class="switch">
                                    <input type="checkbox" id="perm_payment" ${isPaySetChecked ? 'checked' : ''}>
                                    <span class="slider"></span>
                                </label>
                            </div>
                            <div class="perm-item">
                                <span><i class="fas fa-users"></i> Users Management</span>
                                <label class="switch">
                                    <input type="checkbox" id="perm_users" ${isUserChecked ? 'checked' : ''}>
                                    <span class="slider"></span>
                                </label>
                            </div>
                            <div class="perm-item">
                                <span><i class="fas fa-wallet"></i> Deposit Requests</span>
                                <label class="switch">
                                    <input type="checkbox" id="perm_addMoney" ${isAddMonChecked ? 'checked' : ''}>
                                    <span class="slider"></span>
                                </label>
                            </div>
                            <div class="perm-item">
                                <span><i class="fas fa-images"></i> Manage Banners</span>
                                <label class="switch">
                                    <input type="checkbox" id="perm_banners" ${isBanChecked ? 'checked' : ''}>
                                    <span class="slider"></span>
                                </label>
                            </div>
                            <div class="perm-item">
                                <span><i class="fas fa-list"></i> Manage Categories</span>
                                <label class="switch">
                                    <input type="checkbox" id="perm_categories" ${isCatChecked ? 'checked' : ''}>
                                    <span class="slider"></span>
                                </label>
                            </div>
                            <div class="perm-item">
                                <span><i class="fas fa-gamepad"></i> Manage Matches</span>
                                <label class="switch">
                                    <input type="checkbox" id="perm_matches" ${isMatchChecked ? 'checked' : ''}>
                                    <span class="slider"></span>
                                </label>
                            </div>
                        </div>
                    `,
                    showCancelButton: true,
                    confirmButtonText: 'Save Permissions',
                    cancelButtonText: 'Cancel',
                    confirmButtonColor: '#b026ff',
                    cancelButtonColor: '#ff4757',
                    preConfirm: () => {
                        return {
                            appSettings: document.getElementById('perm_appSettings').checked,
                            paymentSettings: document.getElementById('perm_payment').checked,
                            users: document.getElementById('perm_users').checked,
                            addMoney: document.getElementById('perm_addMoney').checked,
                            banners: document.getElementById('perm_banners').checked,
                            categories: document.getElementById('perm_categories').checked,
                            matches: document.getElementById('perm_matches').checked
                        };
                    }
                }).then(result => {
                    if (result.isConfirmed) {
                        db.ref('admins/' + adminKey + '/permissions').set(result.value)
                            .then(() => {
                                SwalDark.fire('Success', 'Permissions updated successfully!', 'success');
                                loadAdminsList();
                            })
                            .catch(err => SwalDark.fire('Error', err.message, 'error'));
                    }
                });
            });
        }

        // Modal: Add New Normal Admin
        function openAddAdminModal() {
            SwalDark.fire({
                title: '<i class="fas fa-user-plus" style="color: var(--cyan-accent);"></i> Add New Admin',
                html: `
                    <div style="text-align: left; margin-top: 10px;">
                        <label style="font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 5px;">Admin Email Address</label>
                        <input type="email" id="newAdminEmail" class="swal2-input" placeholder="admin@example.com" style="width: 100%; box-sizing: border-box; margin: 0 0 15px 0; background: #0b061a; color: white; border: 1px solid rgba(255,255,255,0.2);">
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'Add Admin',
                confirmButtonColor: '#00ffd1',
                cancelButtonColor: '#ff4757',
                preConfirm: () => {
                    const email = document.getElementById('newAdminEmail').value.trim();
                    if (!email) {
                        Swal.showValidationMessage('Please enter a valid email address');
                        return false;
                    }
                    return email;
                }
            }).then(result => {
                if (result.isConfirmed) {
                    const email = result.value;
                    const key = emailToKey(email);

                    // Check if already super admin
                    db.ref('superAdmins/' + key).once('value', sSnap => {
                        if (sSnap.exists()) {
                            SwalDark.fire('Notice', 'This user is already a Super Admin!', 'info');
                            return;
                        }

                        // Add to regular admins with ALL permissions default to true
                        const defaultPermissions = {
                            appSettings: true,
                            paymentSettings: true,
                            users: true,
                            addMoney: true,
                            banners: true,
                            categories: true,
                            matches: true
                        };

                        db.ref('admins/' + key).set({
                            email: email,
                            addedAt: firebase.database.ServerValue.TIMESTAMP,
                            permissions: defaultPermissions
                        }).then(() => {
                            SwalDark.fire('Added!', `${email} is now an Admin.`, 'success');
                            loadAdminsList();
                        }).catch(err => {
                            SwalDark.fire('Error', err.message, 'error');
                        });
                    });
                }
            });
        }

        // Remove Normal Admin
        function removeAdmin(adminKey, adminEmail) {
            if (adminEmail.toLowerCase() === currentUserEmail.toLowerCase()) {
                SwalDark.fire('Action Denied', 'You cannot remove yourself!', 'warning');
                return;
            }

            SwalDark.fire({
                title: 'Are you sure?',
                text: `Remove ${adminEmail} from System Admins?`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ff4757',
                cancelButtonColor: '#332d48',
                confirmButtonText: 'Yes, Remove'
            }).then(result => {
                if (result.isConfirmed) {
                    db.ref('admins/' + adminKey).remove()
                        .then(() => {
                            SwalDark.fire('Removed', 'Admin removed successfully.', 'success');
                            loadAdminsList();
                        })
                        .catch(err => SwalDark.fire('Error', err.message, 'error'));
                }
            });
        }
    </script>
</body>
</html>
